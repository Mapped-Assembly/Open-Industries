<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FIELD-LAB — runtime scene</title>
<style>body{margin:0;background:#eef0ec;color:#203d3c;font:15px system-ui}header,nav,aside{padding:16px}h1{margin:0;font-size:24px}main{display:grid;grid-template-columns:minmax(0,3fr) minmax(270px,1fr)}canvas{display:block;width:100%}button,select,input{margin:5px;padding:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px monospace}#finding{color:#74470f}#timeline{width:65%}#status{font-weight:600}aside{background:white}@media(max-width:800px){main{display:block}}</style></head>
<body><header><h1>FIELD-LAB / Recorded job motion</h1><p>Simulated jobs · OpenCAD component handoff · No assay or hardware validation</p><div id="status" role="status">Connect to a local station or import a recording.</div><div id="finding"></div></header>
<nav><button id="connect">Connect / reconnect</button><button id="disconnect">Disconnect viewer</button><label>Import recording <input id="import" type="file" accept=".json"></label><button id="export">Export recording</button><button id="screenshot">Export screenshot</button><button id="overview">Overview</button><button id="focus">Focus selected equipment</button><button id="play">Play recorded events</button><input id="timeline" type="range" min="0" max="0" value="0" aria-label="Recorded event"><span id="cursor"></span></nav>
<main><div id="view"></div><aside><label>Scene occurrence <select id="selection"></select></label><div id="selection-state"></div><button id="pause">Pause job</button><button id="resume">Resume job</button><button id="fail">Model instrument failure</button><details><summary>Evidence and limitations</summary><pre id="details"></pre></details></aside></main>
<script type="module" src="./runtime-viewer.ts"></script></body></html>
