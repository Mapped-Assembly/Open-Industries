    <text x='402' y='465' font-family='sans-serif' font-size='10' fill='#64748b'>TOP-FIXTURE</text>
    <text x='402' y='492' font-family='sans-serif' font-size='10' font-weight='600' fill='#475569'>Est: $5.00</text>
