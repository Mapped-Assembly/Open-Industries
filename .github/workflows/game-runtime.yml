name: Game runtime
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  mcp:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:mcp-game
      - run: npm run test:mcp
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OI_GAME_PG_BIN: /usr/lib/postgresql/16/bin
      OI_GAME_PGDATA: /tmp/oi-game-pg
      OI_GAME_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:54328/oi_game_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install PostgreSQL and pg_cron
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-16 postgresql-16-cron
      - name: Start disposable cluster
        run: |
          "$OI_GAME_PG_BIN/initdb" -D "$OI_GAME_PGDATA" --username=postgres --auth=trust
          cat >> "$OI_GAME_PGDATA/postgresql.conf" <<EOF
          listen_addresses = '127.0.0.1'
          port = 54328
          unix_socket_directories = '${{ runner.temp }}'
          shared_preload_libraries = 'pg_cron'
          cron.database_name = 'oi_game_test'
          cron.use_background_workers = on
          max_worker_processes = 20
          EOF
          "$OI_GAME_PG_BIN/pg_ctl" -D "$OI_GAME_PGDATA" -l "$OI_GAME_PGDATA/server.log" start
          "$OI_GAME_PG_BIN/createdb" -h 127.0.0.1 -p 54328 -U postgres oi_game_test
      - run: npm run test:game-postgres
      - name: Database security and performance advisors
        run: npx supabase db advisors --db-url "$OI_GAME_TEST_DATABASE_URL" --type all --fail-on error
      - name: Stop disposable cluster
        if: always()
        run: |
          if test -f "$OI_GAME_PGDATA/postmaster.pid"; then
            "$OI_GAME_PG_BIN/pg_ctl" -D "$OI_GAME_PGDATA" -m fast stop
          fi
