name: Game runtime
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  mcp:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:mcp-game
      - run: npm run test:mcp
