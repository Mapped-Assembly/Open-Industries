name: Camera and OpenCV observations
on:
  pull_request:
    paths:
      - 'services/vision/**'
      - 'deploy/inspection/**'
      - 'server/*vision*'
      - 'server/mcp-agent.mjs'
      - 'server/astra-mcp.mjs'
      - 'package*.json'
      - '.github/workflows/vision.yml'
  push:
    branches: [main]
    paths:
      - 'services/vision/**'
      - 'deploy/inspection/**'
      - 'server/*vision*'
      - 'server/mcp-agent.mjs'
      - 'server/astra-mcp.mjs'
      - 'package*.json'
      - '.github/workflows/vision.yml'
permissions:
  contents: read
jobs:
  vision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python -m pip install ./services/vision
      - run: python -m unittest discover -s services/vision/tests -v
        env:
          OI_VISION_MCP_TESTS: '1'
      - run: npm run test:mcp
      - run: bash -n deploy/inspection/install.sh deploy/inspection/mcp.sh deploy/inspection/record.sh
      - run: python -m pip install cfn-lint==1.58.0
      - run: cfn-lint deploy/inspection/station.cfn.json
