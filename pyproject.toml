[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-industries"
version = "0.1.0"
description = "Static Open Industries scene exporter for georeferenced 3D Tiles"
readme = {file = "tools/geospatial/README.md", content-type = "text/markdown"}
license = {file = "tools/geospatial/LICENSE"}
requires-python = ">=3.11"
authors = [{name = "Mapped Assembly"}]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/Mapped-Assembly/Open-Industries"
Repository = "https://github.com/Mapped-Assembly/Open-Industries"
Issues = "https://github.com/Mapped-Assembly/Open-Industries/issues"

[project.scripts]
oi-export-scene = "export_scene:main"

[tool.setuptools]
package-dir = {"" = "tools/geospatial"}
py-modules = ["export_scene"]
